name: Story 189 Windows registration diagnostics
on:
  push:
    branches: ['codex/189-http-consumers']
    paths: ['.github/workflows/189-windows-registration-diagnostics.yml']
permissions:
  contents: read
jobs:
  stock-registration:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: ['24', '26', 'current']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Actual stock calls and original budgets; timing is diagnostic data only.
      - run: >-
          node --import ./test/helpers/windows-authority-trace.mjs --test
          --test-concurrency=1
          --test-name-pattern="revalidated admission preserves unrelated clone|existing registration reads and updates"
          test/unit/portable-authority-fences.test.mjs
          test/unit/runtime-selection-cases/selection.mjs
