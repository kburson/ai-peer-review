name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Windows CI is deferred; current scope is Linux/macOS only
        required: true
        default: linux-macos
        type: choice
        options: [linux-macos]
      live_claude:
        description: Run the optional disposable Claude permission conformance probe
        required: false
        default: false
        type: boolean

env:
  # Native build verification is suspended while the JavaScript-only broker migrates.
  # Skipped native cases provide no conformance evidence; JS receipt lanes still run.
  APR_SKIP_NATIVE_BROKER_TESTS: '1'
  GH_TOKEN: ${{ github.token }}
  APR_CI_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  issues: read

# A push and its PR event verify the same branch. Keep the latest run for that
# source branch; fork repositories have separate groups.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Native broker build and verification paused for #102/#107.
# Source suites report broker exclusions until #107 replaces native transport.
jobs:
  # Windows CI is deferred on every branch under #223; historical receipts remain intact.
  scope:
    name: Verification scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.selected.outputs.scope }}
      os: ${{ steps.selected.outputs.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select declared platform scope
        id: selected
        env:
          APR_CI_EVENT_NAME: ${{ github.event_name }}
          APR_CI_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          APR_CI_SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          APR_CI_REF_TYPE: ${{ github.ref_type }}
          APR_CI_REQUESTED_SCOPE: ${{ inputs.verification_scope || 'linux-macos' }}
        run: node scripts/ci/verification-scope.mjs
      - name: 'Declare scope: ${{ steps.selected.outputs.scope }}'
        run: node -e "console.log('Verification scope declared.')"

  node-24:
    needs: scope
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      APR_CI_JOB_KEY: node-24-24-${{ matrix.os }}
      APR_CI_MATRIX_NODE: '24'
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prepare the stock interpreter/module loader before bounded authority tests.
      # No principal or ACL observation is produced or retained; probes remain fresh.
      - name: Initialize stock Windows PowerShell
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
          Write-Output 'Stock Windows PowerShell initialization complete.'
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: Prepare approved contract reference
        run: node --import ./test/helpers/contract-source-transport-diagnostics.mjs scripts/ci/prepare-contract-adoption.mjs
      - run: npm run format:check
      - run: npm run lint
      - name: 'Verify tests: fast'
        run: node scripts/ci/record-tests.mjs fast
      - name: 'Verify tests: integration'
        if: runner.os != 'Windows'
        run: node scripts/ci/record-tests.mjs integration
        env:
          GH_TOKEN: ${{ github.token }}
          APR_CONTRACT_GITHUB_CONFORMANCE: '1'
      - name: 'Verify tests: mcp'
        run: node scripts/ci/record-tests.mjs mcp
      - name: 'Verify tests: packaging'
        run: node scripts/ci/record-tests.mjs packaging
      - name: 'Verify tests: smoke'
        run: node scripts/ci/record-tests.mjs smoke
      - run: npm run pack:runtime -- --dry-run

      - name: Publish actual test execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error

  preferred-node:
    needs: scope
    name: Node ${{ matrix.node }} / ${{ matrix.os == 'ubuntu-latest' && 'Ubuntu' || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['26', 'current']
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      APR_CI_JOB_KEY: preferred-node-${{ matrix.node }}-${{ matrix.os }}
      APR_CI_MATRIX_NODE: '${{ matrix.node }}'
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Prepare the stock interpreter/module loader before bounded authority tests.
      # No principal or ACL observation is produced or retained; probes remain fresh.
      - name: Initialize stock Windows PowerShell
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
          Write-Output 'Stock Windows PowerShell initialization complete.'
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: Prepare approved contract reference
        run: node --import ./test/helpers/contract-source-transport-diagnostics.mjs scripts/ci/prepare-contract-adoption.mjs
      - run: npm run format:check
      - run: npm run lint
      - name: 'Verify tests: fast'
        run: node scripts/ci/record-tests.mjs fast
      - name: 'Verify tests: integration'
        if: runner.os != 'Windows'
        run: node scripts/ci/record-tests.mjs integration
        env:
          GH_TOKEN: ${{ github.token }}
          APR_CONTRACT_GITHUB_CONFORMANCE: '1'
      - name: 'Verify tests: mcp'
        run: node scripts/ci/record-tests.mjs mcp
      - name: 'Verify tests: packaging'
        run: node scripts/ci/record-tests.mjs packaging
      - name: 'Verify tests: smoke'
        run: node scripts/ci/record-tests.mjs smoke
      - run: npm run pack:runtime -- --dry-run

      - name: Publish actual test execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error

  # Dedicated machines retain every owner case without loading the baseline's
  # expensive stock Windows probes at the same time. Each partition publishes receipts.
  owner-publication-windows:
    needs: scope
    if: ${{ false }} # Windows CI deferred under #223.
    name: Owner publication ${{ matrix.group }} / Node ${{ matrix.node }} / windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26', 'current']
        group: ['generations', 'quarantine', 'budget', 'faults']
    runs-on: windows-latest
    env:
      APR_CI_JOB_KEY: owner-publication-${{ matrix.group }}-${{ matrix.node }}-windows-latest
      APR_CI_MATRIX_NODE: '${{ matrix.node }}'
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Prepare the stock interpreter/module loader before bounded authority tests.
      # No principal or ACL observation is produced or retained; probes remain fresh.
      - name: Initialize stock Windows PowerShell
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
          Write-Output 'Stock Windows PowerShell initialization complete.'
      - name: 'Verify tests: owner-publication-${{ matrix.group }}'
        run: node scripts/ci/record-tests.mjs owner-publication-${{ matrix.group }}
      - name: Publish actual test execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error

  portable-ownership-windows:
    needs: scope
    if: ${{ false }} # Windows CI deferred under #223.
    name: Portable ownership / Node ${{ matrix.node }} / windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26', 'current']
    runs-on: windows-latest
    env:
      APR_CI_JOB_KEY: portable-ownership-${{ matrix.node }}-windows-latest
      APR_CI_MATRIX_NODE: '${{ matrix.node }}'
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Prepare the stock interpreter/module loader before bounded authority tests.
      # No principal or ACL observation is produced or retained; probes remain fresh.
      - name: Initialize stock Windows PowerShell
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
          Write-Output 'Stock Windows PowerShell initialization complete.'
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: 'Verify tests: portable-ownership'
        run: node scripts/ci/record-tests.mjs portable-ownership
      - name: Publish actual test execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error

  npm-pack-compatibility:
    name: npm ${{ matrix.npm }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 24
            npm: '11.8.0'
          - node: 26
            npm: '12.0.2'
    runs-on: ubuntu-latest
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global "npm@${{ matrix.npm }}"
      - run: test "$(npm --version)" = "${{ matrix.npm }}"
      - run: npm ci
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: Verify packed builder, dependency and source inventory
        run: npm run test:packaging
      - run: npm run test:smoke

  phase-2-boundary:
    name: Phase 2 boundary
    runs-on: ubuntu-latest
    env:
      APR_CI_JOB_KEY: phase-2-boundary-26-ubuntu-latest
      APR_CI_MATRIX_NODE: '26'
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: Prepare approved contract reference
        run: node --import ./test/helpers/contract-source-transport-diagnostics.mjs scripts/ci/prepare-contract-adoption.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: node scripts/verify-extraction.mjs --require-legacy-removed
      - run: npm ls --omit=dev --json
      - name: 'Verify tests: fast'
        run: node scripts/ci/record-tests.mjs fast
      - name: 'Verify tests: integration'
        if: runner.os != 'Windows'
        run: node scripts/ci/record-tests.mjs integration
        env:
          GH_TOKEN: ${{ github.token }}
          APR_CONTRACT_GITHUB_CONFORMANCE: '1'
      - name: 'Verify tests: mcp'
        run: node scripts/ci/record-tests.mjs mcp
      - name: 'Verify tests: packaging'
        run: node scripts/ci/record-tests.mjs packaging
      - name: 'Verify tests: smoke'
        run: node scripts/ci/record-tests.mjs smoke
      - run: npm run pack:runtime -- --dry-run

      - name: Publish actual test execution records
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error

  live-provider-optional:
    name: Optional live-provider probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_claude == true }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_LIVE_MODEL: ${{ vars.CLAUDE_LIVE_MODEL }}
      CLAUDE_LIVE_EFFORT: high
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require the explicit live-provider secret
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: exit 1
      - name: Install the optional Claude runtime
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm install --global @anthropic-ai/claude-code
      - name: Run disposable live permission conformance
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: >-
          node test/live/claude-live-conformance.mjs
          --output "${{ runner.temp }}/claude-conformance/sanitized-result.json"
      - name: Upload sanitized conformance evidence
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: claude-live-conformance-sanitized
          path: ${{ runner.temp }}/claude-conformance/sanitized-result.json
          if-no-files-found: error

  portable-units:
    needs: scope
    if: ${{ false }} # Windows CI deferred under #223.
    name: Portable units / ${{ matrix.group }} / Node ${{ matrix.node }} / windows-latest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      # Start the longer partitions first; keep the same twelve isolated jobs,
      # four-worker cap, file partitions and original operation/lane budgets.
      matrix:
        group: [identity, selection, authority, storage]
        node: ['26', 'current', '24']
    env:
      APR_CI_JOB_KEY: portable-unit-${{ matrix.group }}-${{ matrix.node }}-windows-latest
      APR_CI_MATRIX_NODE: ${{ matrix.node }}
    steps:
      - name: Enable Windows long checkout paths
        if: runner.os == 'Windows'
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Prepare the stock interpreter/module loader before bounded authority tests.
      # No principal or ACL observation is produced or retained; probes remain fresh.
      - name: Initialize stock Windows PowerShell
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
          Write-Output 'Stock Windows PowerShell initialization complete.'
      - name: Warm offline runtime dependencies
        run: node test/helpers/warm-packed-cache.mjs
      - name: 'Verify tests: portable-unit-${{ matrix.group }}'
        run: node scripts/ci/record-tests.mjs portable-unit-${{ matrix.group }}
      - name: 'Verify tests: portable-integration-${{ matrix.group }}'
        run: node scripts/ci/record-tests.mjs portable-integration-${{ matrix.group }}
        env:
          GH_TOKEN: ${{ github.token }}
          APR_CONTRACT_GITHUB_CONFORMANCE: '1'
      - name: Upload portable unit receipt and raw output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apr-ci-${{ env.APR_CI_JOB_KEY }}-${{ github.run_attempt }}
          path: .scratch/ci-results/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
