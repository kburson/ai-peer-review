name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-22:
    name: Node 22 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:packaging
      - run: npm run test:smoke
      - run: npm pack --dry-run

  later-node:
    name: Node ${{ matrix.node }} / Ubuntu
    strategy:
      fail-fast: false
      matrix:
        node: ['lts/*', 'current']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:packaging
      - run: npm run test:smoke

  phase-1-boundary:
    name: Phase 1 boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-extraction.mjs --require-legacy-removed
      - run: npm ls --omit=dev --json
      - run: npm run test:packaging
      - run: npm run test:smoke

  live-provider-optional:
    name: Optional live-provider probe
    if: ${{ false }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Live provider verification is opt-in and never required.'
