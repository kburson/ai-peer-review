name: Selection scope C1 feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    name: Original-budget C1 prototype / Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: ['24', '26']
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      APR_SKIP_NATIVE_BROKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retain genuine feasibility and original-budget refusals
        run: |
          node --test test/live/selection-scope-c1-prototype.mjs > scope-c1-feasibility.log 2>&1
      - name: Preserve diagnostic collateral regardless of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scope-c1-${{ runner.os }}-${{ matrix.node }}-${{ github.run_attempt }}
          path: scope-c1-feasibility.log
          if-no-files-found: error
          retention-days: 30
