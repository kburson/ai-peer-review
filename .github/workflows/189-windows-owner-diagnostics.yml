name: Story 189 Windows owner probe diagnostics
on:
  push:
    branches: ['codex/189-http-consumers']
    paths: ['.github/workflows/189-windows-owner-diagnostics.yml']
permissions:
  contents: read
jobs:
  stock-owner-budget:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: ['24', '26', 'current']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Actual original stock inputs, handles, outcomes and deadlines. No receipt.
      - run: >-
          node --import ./test/helpers/windows-authority-trace.mjs --test
          --test-concurrency=1
          test/integration/owner-publication-cases/budget.mjs
