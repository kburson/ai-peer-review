name: Story 187 Windows registration diagnostics
on:
  push:
    branches: ['codex/187-selection-fences']
    paths: ['.github/workflows/187-windows-registration-diagnostics.yml']
permissions:
  contents: read
jobs:
  stock-registration:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['26', 'current']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Actual stock calls and original budgets; diagnostic output is not an acceptance receipt.
      - run: >-
          node --import ./test/helpers/windows-authority-trace.mjs --test
          --test-concurrency=1
          --test-name-pattern="selection awaits account discovery|relocation requires explicit update"
          test/unit/portable-authority-fences.test.mjs
          test/unit/runtime-selection-cases/authority.mjs
