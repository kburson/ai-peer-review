name: Selection scope operation comparison
on:
  push:
    branches: [codex/190-installed-journeys]
    paths:
      # Normal class acceptance must precede this genuine operation comparison.
      - src/protocol/process-source-contracts.json
  workflow_dispatch:
    inputs:
      primary_operation_diagnostic:
        description: Run only unverified Windows primary scope controls
        type: boolean
        required: false
        default: false
      diagnostic_scope:
        description: Closed scope for the unverified primary diagnostic
        type: choice
        options: [focused, file]
        required: false
        default: focused
permissions:
  contents: read
jobs:
  compare:
    if: ${{ inputs.primary_operation_diagnostic != true }}
    name: Genuine operation comparison / Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        node: ['24', '26']
    env:
      APR_SKIP_NATIVE_BROKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node test/helpers/warm-packed-cache.mjs
      - run: node test/helpers/selection-scope-operation-ci.mjs
      - name: Retain finite comparisons and inconclusive outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-scope-linux-${{ matrix.node }}-${{ github.run_attempt }}
          path: .scratch/190-scope-comparison-public/
          if-no-files-found: error
          retention-days: 30

  primary-operation-diagnostic:
    if: ${{ inputs.primary_operation_diagnostic == true }}
    name: Unverified primary scope diagnostic / Windows / Node 26
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Enable Windows long checkout paths
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Initialize stock Windows PowerShell without retaining authority
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $env:PSModulePath = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules'
          Get-Command -Name Get-Acl, Set-Acl, ConvertFrom-Json, ConvertTo-Json -CommandType Cmdlet -ErrorAction Stop | Out-Null
          $null = [System.Security.AccessControl.DirectorySecurity]
          $null = [System.Security.AccessControl.FileSecurity]
          $null = [System.Security.AccessControl.RawSecurityDescriptor]
          $null = '{"initialized":true}' | ConvertFrom-Json | ConvertTo-Json -Compress
      - run: node test/helpers/primary-operation-diagnostics.mjs
        env:
          APR_PRIMARY_DIAGNOSTIC_SCOPE: ${{ inputs.diagnostic_scope }}
      - name: Compare isolated controls on the same runner after the full file
        if: ${{ always() && inputs.diagnostic_scope == 'file' }}
        run: node test/helpers/primary-operation-diagnostics.mjs
        env:
          APR_PRIMARY_DIAGNOSTIC_SCOPE: focused
      - name: Retain incomplete diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-operation-diagnostic-${{ github.run_attempt }}
          path: .scratch/209-primary-diagnostic/
          if-no-files-found: error
          retention-days: 14
